<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echoria — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue-dark: #0a0a18;
  --blue-mid:  #12122a;
  --blue-card: #181836;
  --border:    #2e2e6e;
  --accent:    #5555cc;
  --accent-hi: #8888ff;
  --cyan:      #44ddff;
  --cyan-dim:  #1a6a88;
  --text:      #dde6ff;
  --muted:     #7080aa;
  --error-bg:  #1f0808;
  --error-bd:  #cc3333;
  --error-tx:  #ff7777;
}

body {
  background: var(--blue-dark);
  font-family: 'Press Start 2P', monospace;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ── Animated star field ── */
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff;
  animation: twinkle var(--d, 3s) var(--delay, 0s) infinite alternate;
}
@keyframes twinkle {
  0%   { opacity: 0.1; }
  100% { opacity: 0.9; }
}

/* ── Pixel grid overlay ── */
.grid-overlay {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(var(--blue-mid) 1px, transparent 1px),
    linear-gradient(90deg, var(--blue-mid) 1px, transparent 1px);
  background-size: 32px 32px;
  opacity: 0.35;
  pointer-events: none;
  z-index: 0;
}

/* ── Scanline effect ── */
.scanlines {
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,0.08) 3px,
    rgba(0,0,0,0.08) 4px
  );
  pointer-events: none;
  z-index: 5;
}

/* ── Floating pixel shapes (decorative) ── */
.pixel-deco {
  position: fixed;
  pointer-events: none;
  z-index: 0;
}
.pixel-deco span {
  display: block;
  background: var(--accent);
  opacity: 0.12;
  animation: float var(--fd, 8s) var(--fdelay, 0s) ease-in-out infinite alternate;
}
@keyframes float {
  0%   { transform: translateY(0); }
  100% { transform: translateY(-18px); }
}

/* ── Main card ── */
.card {
  position: relative;
  z-index: 10;
  width: 420px;
  background: var(--blue-card);
  border: 3px solid var(--border);
  box-shadow:
    0 0 0 1px var(--accent),
    8px 8px 0 var(--blue-dark),
    inset 0 1px 0 rgba(136,136,255,0.1);
  animation: cardIn 0.4s steps(6) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Corner pixels ── */
.card::before, .card::after {
  content: '';
  position: absolute;
  width: 8px;
  height: 8px;
  background: var(--cyan);
}
.card::before { top: -1px; left: -1px; }
.card::after  { bottom: -1px; right: -1px; }

/* ── Header ── */
.header {
  padding: 28px 28px 20px;
  border-bottom: 2px solid var(--border);
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(85,85,204,0.15) 0%, transparent 60%);
  pointer-events: none;
}

.logo-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 10px;
}

/* ── Pixel logo icon ── */
.logo-icon {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  image-rendering: pixelated;
}

.logo-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 22px;
  color: var(--cyan);
  letter-spacing: 2px;
  text-shadow: 3px 3px 0 rgba(0,0,0,0.6), 0 0 20px rgba(68,221,255,0.4);
}

.logo-sub {
  font-family: 'VT323', monospace;
  font-size: 18px;
  color: var(--muted);
  letter-spacing: 1px;
  padding-left: 50px;
}

/* ── Online badge ── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'VT323', monospace;
  font-size: 14px;
  color: #44ff99;
  float: right;
  margin-top: -22px;
}
.badge-dot {
  width: 6px;
  height: 6px;
  background: #44ff99;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ── Tabs ── */
.tabs {
  display: flex;
  border-bottom: 2px solid var(--border);
}
.tab-btn {
  flex: 1;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 14px 10px;
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  letter-spacing: 1px;
  transition: color 0.1s;
  position: relative;
}
.tab-btn.active {
  color: var(--cyan);
  background: rgba(68,221,255,0.05);
}
.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0; right: 0;
  height: 2px;
  background: var(--cyan);
}
.tab-btn:not(.active):hover { color: var(--text); }

/* ── Body ── */
.body {
  padding: 24px 28px 28px;
}

/* ── Error ── */
.error-msg {
  font-family: 'VT323', monospace;
  font-size: 16px;
  color: var(--error-tx);
  background: var(--error-bg);
  border: 2px solid var(--error-bd);
  padding: 10px 14px;
  margin-bottom: 18px;
  display: none;
  line-height: 1.5;
}
.error-msg.show { display: block; }

/* ── Forms ── */
.form { display: none; }
.form.active { display: flex; flex-direction: column; gap: 16px; }

.field { display: flex; flex-direction: column; gap: 8px; }

label {
  font-size: 7px;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

input {
  font-family: 'VT323', monospace;
  font-size: 18px;
  padding: 12px 14px;
  background: var(--blue-mid);
  border: 2px solid var(--border);
  color: var(--text);
  outline: none;
  letter-spacing: 0.5px;
  transition: border-color 0.1s;
  caret-color: var(--cyan);
}
input::placeholder { color: #3a4466; }
input:focus {
  border-color: var(--accent-hi);
  box-shadow: inset 0 0 0 1px rgba(136,136,255,0.2);
}

/* ── CTA Button ── */
.btn-primary {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  padding: 16px;
  background: var(--accent);
  border: 2px solid var(--accent-hi);
  color: #fff;
  cursor: pointer;
  letter-spacing: 1px;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
  transition: background 0.1s;
  margin-top: 4px;
  position: relative;
  overflow: hidden;
}
.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: rgba(255,255,255,0.25);
}
.btn-primary:hover { background: #6666ee; }
.btn-primary:active {
  transform: translate(3px, 3px);
  box-shadow: 1px 1px 0 rgba(0,0,0,0.5);
}

/* ── Divider ── */
.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 4px 0;
}
.divider-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}
.divider-text {
  font-family: 'VT323', monospace;
  font-size: 14px;
  color: var(--muted);
}

/* ── Footer ── */
.card-footer {
  padding: 12px 28px;
  border-top: 2px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.footer-text {
  font-family: 'VT323', monospace;
  font-size: 13px;
  color: var(--muted);
}
.version {
  font-family: 'VT323', monospace;
  font-size: 13px;
  color: var(--border);
}

/* ── Corner decorations ── */
.corner-deco {
  position: absolute;
  width: 4px;
  height: 4px;
  background: var(--accent-hi);
}
</style>
</head>
<body>

<!-- Background layers -->
<div class="stars" id="stars"></div>
<div class="grid-overlay"></div>
<div class="scanlines"></div>

<!-- Floating pixel shapes -->
<div class="pixel-deco" style="top:15%; left:8%; --fd:9s; --fdelay:0s;">
  <span style="width:12px;height:12px;"></span>
</div>
<div class="pixel-deco" style="top:60%; left:6%; --fd:7s; --fdelay:1s;">
  <span style="width:6px;height:6px;"></span>
</div>
<div class="pixel-deco" style="top:30%; right:9%; --fd:11s; --fdelay:0.5s;">
  <span style="width:10px;height:10px;"></span>
</div>
<div class="pixel-deco" style="top:75%; right:7%; --fd:8s; --fdelay:2s;">
  <span style="width:16px;height:16px;"></span>
</div>

<div class="card">

  <!-- Header -->
  <div class="header">
    <div class="badge"><div class="badge-dot"></div>ONLINE</div>
    <div class="logo-row">
      <!-- Pixel art "E" shield icon -->
      <svg class="logo-icon" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="0" width="14" height="2" fill="#44ddff"/>
        <rect x="2" y="2" width="2" height="14" fill="#44ddff"/>
        <rect x="2" y="8" width="10" height="2" fill="#44ddff"/>
        <rect x="2" y="14" width="14" height="2" fill="#44ddff"/>
        <rect x="4" y="2" width="10" height="2" fill="#44ddff"/>
        <rect x="4" y="14" width="10" height="2" fill="#44ddff"/>
        <rect x="14" y="0" width="2" height="2" fill="#44ddff"/>
        <rect x="14" y="14" width="2" height="2" fill="#44ddff"/>
        <rect x="4" y="4" width="2" height="4" fill="#1a6a88"/>
        <rect x="4" y="10" width="2" height="4" fill="#1a6a88"/>
      </svg>
      <div class="logo-title">ECHORIA</div>
    </div>
    <div class="logo-sub">// Your world. Your vibe.</div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">[ LOG IN ]</button>
    <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">[ SIGN UP ]</button>
  </div>

  <!-- Body -->
  <div class="body">
    <div class="error-msg" id="errorMsg"></div>

    <!-- Login Form -->
    <div class="form active" id="loginForm">
      <div class="field">
        <label>Email Address</label>
        <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-primary" onclick="login()">▶ ENTER ECHORIA</button>
    </div>

    <!-- Signup Form -->
    <div class="form" id="signupForm">
      <div class="field">
        <label>Username</label>
        <input id="signupUsername" type="text" placeholder="coolname123" maxlength="20" autocomplete="username" />
      </div>
      <div class="field">
        <label>Email Address</label>
        <input id="signupEmail" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="signupPassword" type="password" placeholder="min 6 characters" autocomplete="new-password" />
      </div>
      <button class="btn-primary" onclick="signup()">▶ CREATE ACCOUNT</button>
    </div>
  </div>

  <!-- Footer -->
  <div class="card-footer">
    <div class="footer-text">© 2025 ECHORIA</div>
    <div class="version">v0.9.4-beta</div>
  </div>

</div>

<script>
  /* ── Star field ── */
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top  = Math.random() * 100 + '%';
    s.style.setProperty('--d', (2 + Math.random() * 4).toFixed(1) + 's');
    s.style.setProperty('--delay', (Math.random() * 4).toFixed(1) + 's');
    s.style.opacity = Math.random() * 0.7;
    if (Math.random() > 0.85) { s.style.width = '3px'; s.style.height = '3px'; }
    starsEl.appendChild(s);
  }

  /* ── Tabs ── */
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
    document.getElementById(tab + 'Form').classList.add('active');
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    hideError();
  }

  /* ── Error ── */
  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = '! ' + msg;
    el.classList.add('show');
  }
  function hideError() {
    document.getElementById('errorMsg').classList.remove('show');
  }

  /* ── Login ── */
  async function login() {
    hideError();
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) return showError('Please fill in all fields');
    try {
      const res  = await fetch('https://echoria.onrender.com/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error);
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/index.html';
    } catch { showError('Connection failed — try again'); }
  }

  /* ── Signup ── */
  async function signup() {
    hideError();
    const username = document.getElementById('signupUsername').value.trim();
    const email    = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    if (!username || !email || !password) return showError('Please fill in all fields');
    if (password.length < 6) return showError('Password must be at least 6 characters');
    try {
      const res  = await fetch('https://echoria.onrender.com/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error);
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/index.html';
    } catch { showError('Connection failed — try again'); }
  }

  /* ── Enter key ── */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const loginActive = document.getElementById('loginForm').classList.contains('active');
    if (loginActive) login(); else signup();
  });

  /* ── Already logged in ── */
  if (localStorage.getItem('token')) window.location.href = '/index.html';
</script>
</body>
</html>
